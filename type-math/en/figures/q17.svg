<svg xmlns="http://www.w3.org/2000/svg" class="figsvg" viewBox="0 0 640 470" font-family="Noto Sans Bengali, Nirmala UI, Vrinda, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1121f"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d5c"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><rect width="640" height="470" fill="#ffffff"/><g stroke="#111" fill="none"><text x="320.0" y="26" font-size="14" text-anchor="middle" fill="#0b3d6b" font-weight="700" stroke="none">Question 17 — Resultant of three forces</text><line x1="160.0" y1="240.0" x2="440.0" y2="240.0" stroke="#111" stroke-width="1.5" marker-end="url(#arh)" opacity="1"/><line x1="300.0" y1="350.0" x2="300.0" y2="130.0" stroke="#111" stroke-width="1.5" marker-end="url(#arh)" opacity="1"/><text x="446.0" y="245.0" font-size="12" text-anchor="start" fill="#111" font-weight="700" stroke="none">X</text><text x="154.0" y="245.0" font-size="12" text-anchor="end" fill="#111" font-weight="700" stroke="none">X′</text><text x="294.0" y="124.0" font-size="12" text-anchor="end" fill="#111" font-weight="700" stroke="none">Y</text><text x="294.0" y="362.0" font-size="12" text-anchor="end" fill="#111" font-weight="700" stroke="none">Y′</text><text x="288.0" y="256.0" font-size="12" text-anchor="middle" fill="#111" font-weight="700" stroke="none">O</text><line x1="300.0" y1="240.0" x2="420.0" y2="240.0" stroke="#1f6feb" stroke-width="2.3" marker-end="url(#arb)" opacity="1"/><line x1="300.0" y1="240.0" x2="204.0" y2="184.0" stroke="#2a9d5c" stroke-width="2.3" marker-end="url(#arg)" opacity="1"/><line x1="300.0" y1="240.0" x2="242.0" y2="340.0" stroke="#c1121f" stroke-width="2.3" marker-end="url(#arr)" opacity="1"/><text x="414.0" y="260.0" font-size="11" text-anchor="middle" fill="#1f6feb" font-weight="normal" stroke="none">F₁ = 11 N</text><text x="200.0" y="176.0" font-size="11" text-anchor="middle" fill="#2a9d5c" font-weight="normal" stroke="none">F₂ = 22 N</text><text x="228.0" y="346.0" font-size="11" text-anchor="end" fill="#c1121f" font-weight="normal" stroke="none">F₃ = 33 N</text><path d="M258.0,240.0 A42,42 0 0 0 263.6,261.0" stroke="#111" stroke-width="1.3" fill="none"/><text x="245.7" y="257.5" font-size="10" text-anchor="middle" fill="#111" font-weight="normal" stroke="none">60°</text><path d="M279.0,276.4 A42,42 0 0 0 300.0,282.0" stroke="#111" stroke-width="1.3" fill="none"/><text x="286.5" y="298.3" font-size="10" text-anchor="middle" fill="#111" font-weight="normal" stroke="none">30°</text><line x1="24" y1="322" x2="616" y2="322" stroke="#c9d6e2" stroke-width="1"/><text x="30.0" y="340.0" font-size="12" text-anchor="start" fill="#0b3d6b" font-weight="700" stroke="none">Given:</text><text x="30.0" y="358.0" font-size="12" text-anchor="start" fill="#243b53" font-weight="normal" stroke="none">• F₁ = 11 N (along OX)</text><text x="30.0" y="375.0" font-size="12" text-anchor="start" fill="#243b53" font-weight="normal" stroke="none">• F₂ = 22 N (60° with OX′)</text><text x="30.0" y="392.0" font-size="12" text-anchor="start" fill="#243b53" font-weight="normal" stroke="none">• F₃ = 33 N (30° with OY′)</text><text x="30.0" y="409.0" font-size="12" text-anchor="start" fill="#243b53" font-weight="normal" stroke="none">• Three forces act at point O</text></g></svg>