<svg xmlns="http://www.w3.org/2000/svg" class="figsvg" viewBox="0 0 640 470" font-family="Noto Sans Bengali, Nirmala UI, Vrinda, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1121f"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d5c"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><rect width="640" height="470" fill="#ffffff"/><g stroke="#111" fill="none"><text x="320.0" y="26" font-size="14" text-anchor="middle" fill="#0b3d6b" font-weight="700" stroke="none">Question 42 — Relative velocity of car and truck</text><line x1="240.0" y1="260.0" x2="390.0" y2="260.0" stroke="#111" stroke-width="1.4" marker-end="url(#arh)" opacity="1"/><line x1="240.0" y1="260.0" x2="240.0" y2="120.0" stroke="#111" stroke-width="1.4" marker-end="url(#arh)" opacity="1"/><text x="396.0" y="276.0" font-size="11" text-anchor="start" fill="#556" font-weight="normal" stroke="none">E</text><text x="224.0" y="114.0" font-size="11" text-anchor="end" fill="#556" font-weight="normal" stroke="none">N</text><line x1="240.0" y1="260.0" x2="370.0" y2="260.0" stroke="#1f6feb" stroke-width="2.2" marker-end="url(#arb)" opacity="1"/><line x1="240.0" y1="260.0" x2="240.0" y2="140.0" stroke="#2a9d5c" stroke-width="2.2" marker-end="url(#arg)" opacity="1"/><line x1="240.0" y1="260.0" x2="370.0" y2="140.0" stroke="#c1121f" stroke-width="2.2" marker-end="url(#arr)" opacity="1"/><line x1="370.0" y1="260.0" x2="370.0" y2="140.0" stroke="#7b8794" stroke-width="1.1" opacity="1" stroke-dasharray="4 4"/><line x1="240.0" y1="140.0" x2="370.0" y2="140.0" stroke="#7b8794" stroke-width="1.1" opacity="1" stroke-dasharray="4 4"/><text x="340.0" y="280.0" font-size="11" text-anchor="middle" fill="#1f6feb" font-weight="normal" stroke="none">vc</text><text x="226.0" y="170.0" font-size="11" text-anchor="end" fill="#2a9d5c" font-weight="normal" stroke="none">vTC</text><text x="354.0" y="156.0" font-size="11" text-anchor="end" fill="#c1121f" font-weight="normal" stroke="none">vT</text><text x="320.0" y="96.0" font-size="10.5" text-anchor="middle" fill="#556" font-weight="normal" stroke="none">Relative velocity of the truck towards the north (twice the car's velocity)</text><line x1="24" y1="322" x2="616" y2="322" stroke="#c9d6e2" stroke-width="1"/><text x="30.0" y="340.0" font-size="12" text-anchor="start" fill="#0b3d6b" font-weight="700" stroke="none">Given:</text><text x="30.0" y="358.0" font-size="12" text-anchor="start" fill="#243b53" font-weight="normal" stroke="none">• Car 40 km/h eastwards (v_c)</text><text x="30.0" y="375.0" font-size="12" text-anchor="start" fill="#243b53" font-weight="normal" stroke="none">• Relative to the driver, the truck moves northwards at twice his speed</text><text x="30.0" y="392.0" font-size="12" text-anchor="start" fill="#243b53" font-weight="normal" stroke="none">• v_T = actual velocity of the truck</text><text x="30.0" y="409.0" font-size="12" text-anchor="start" fill="#243b53" font-weight="normal" stroke="none">• The truck's direction and the plane-perpendicular vector must be found</text></g></svg>