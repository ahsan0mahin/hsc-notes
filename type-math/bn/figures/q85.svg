<svg xmlns="http://www.w3.org/2000/svg" class="figsvg" viewBox="0 0 640 470" font-family="Noto Sans Bengali, Nirmala UI, Vrinda, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1121f"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d5c"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><rect width="640" height="470" fill="#ffffff"/><g stroke="#111" fill="none"><text x="320.0" y="26" font-size="14" text-anchor="middle" fill="#0b3d6b" font-weight="700" stroke="none">প্রশ্ন ৮৫ — শান্তার হাঁটা ও ছাতা</text><line x1="160.0" y1="250.0" x2="500.0" y2="250.0" stroke="#111" stroke-width="1.5" marker-end="url(#arh)" opacity="1"/><line x1="330.0" y1="300.0" x2="330.0" y2="90.0" stroke="#111" stroke-width="1.5" marker-end="url(#arh)" opacity="1"/><text x="154.0" y="266.0" font-size="11" text-anchor="end" fill="#556" font-weight="normal" stroke="none">দ.</text><text x="506.0" y="266.0" font-size="11" text-anchor="start" fill="#556" font-weight="normal" stroke="none">উ.</text><text x="322.0" y="84.0" font-size="11" text-anchor="end" fill="#556" font-weight="normal" stroke="none">Y</text><text x="322.0" y="312.0" font-size="11" text-anchor="end" fill="#556" font-weight="normal" stroke="none">Y′</text><line x1="330.0" y1="250.0" x2="400.0" y2="132.0" stroke="#1f6feb" stroke-width="2.2" marker-end="url(#arb)" opacity="1"/><text x="408.0" y="128.0" font-size="10.5" text-anchor="start" fill="#1f6feb" font-weight="normal" stroke="none">vr = 8 m s⁻¹</text><path d="M330.0,198.0 A52,52 0 0 0 304.0,205.0" stroke="#111" stroke-width="1.3" fill="none"/><text x="312.9" y="190.2" font-size="10.5" text-anchor="middle" fill="#111" font-weight="normal" stroke="none">40°</text><line x1="330.0" y1="250.0" x2="450.0" y2="250.0" stroke="#2a9d5c" stroke-width="2.1" marker-end="url(#arg)" opacity="1"/><text x="440.0" y="270.0" font-size="11" text-anchor="middle" fill="#2a9d5c" font-weight="normal" stroke="none">vs</text><line x1="400.0" y1="132.0" x2="280.0" y2="132.0" stroke="#c1121f" stroke-width="1.6" opacity="1" stroke-dasharray="6 4"/><text x="340.0" y="124.0" font-size="11" text-anchor="middle" fill="#c1121f" font-weight="normal" stroke="none">−vs</text><line x1="400.0" y1="132.0" x2="330.0" y2="254.0" stroke="#7b3fa0" stroke-width="1.9" marker-end="url(#ar)" opacity="1"/><text x="336.0" y="236.0" font-size="11" text-anchor="end" fill="#7b3fa0" font-weight="normal" stroke="none">vrs</text><path d="M376.8,226.9 A30,30 0 0 1 360.0,232.0" stroke="#111" stroke-width="1.3" fill="none"/><text x="357.0" y="224.0" font-size="9.5" text-anchor="middle" fill="#111" font-weight="normal" stroke="none">20°</text><line x1="24" y1="322" x2="616" y2="322" stroke="#c9d6e2" stroke-width="1"/><text x="30.0" y="340.0" font-size="12" text-anchor="start" fill="#0b3d6b" font-weight="700" stroke="none">দেওয়া আছে:</text><text x="30.0" y="358.0" font-size="12" text-anchor="start" fill="#243b53" font-weight="normal" stroke="none">• বৃষ্টি 8 m s⁻¹, উল্লম্বের সাথে 40°, দক্ষিণ থেকে</text><text x="30.0" y="375.0" font-size="12" text-anchor="start" fill="#243b53" font-weight="normal" stroke="none">• শান্তা দক্ষিণ→উত্তর হাঁটে</text><text x="30.0" y="392.0" font-size="12" text-anchor="start" fill="#243b53" font-weight="normal" stroke="none">• ছাতা পিছনে 20° কোণে ধরে</text><text x="30.0" y="409.0" font-size="12" text-anchor="start" fill="#243b53" font-weight="normal" stroke="none">• vs &lt; vr — যাচাই করতে হবে</text></g></svg>