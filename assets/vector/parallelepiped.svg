  <path d="M190 30 L190 170 M340 110 L340 250 M430 30 L430 170 M100 110 L340 110 M190 170 L430 170" fill="none" stroke="#94a3b8" stroke-opacity="0.35" stroke-dasharray="6 6" />
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="250" x2="340" y2="250" stroke="#8b5cf6" marker-end="url(#a)" />
    <line x1="100" y1="250" x2="190" y2="170" stroke="#22d3ee" marker-end="url(#b)" />
