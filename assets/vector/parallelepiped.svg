  <g fill="#cbd5e1" font-size="14">
    <text x="24" y="36" data-bn="B⃗ × C⃗ = ভূমির ক্ষেত্রফলের ভেক্টর" data-en="B⃗ × C⃗ = area vector of the base">B⃗ × C⃗ = ভূমির ক্ষেত্রফলের ভেক্টর</text>
    <text x="430" y="36" data-bn="A⃗ · (B⃗ × C⃗) = আয়তন" data-en="A⃗ · (B⃗ × C⃗) = volume">A⃗ · (B⃗ × C⃗) = আয়তন</text>
  </g>
  <g fill="#64748b" font-size="11.5">
    <text x="24" y="318" data-bn="স্কেলার ত্রিগুণফল প্যারালেলেপাইপডের আয়তন দেয়" data-en="scalar triple product gives the parallelepiped volume">স্কেলার ত্রিগুণফল প্যারালেলেপাইপডের আয়তন দেয়</text>
    <text x="430" y="318" data-bn="মান 0 হলে তিন ভেক্টর সমতলীয়" data-en="zero means the three vectors are coplanar">মান 0 হলে তিন ভেক্টর সমতলীয়</text>
