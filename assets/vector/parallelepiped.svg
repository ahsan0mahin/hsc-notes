    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f59e0b" /></marker>
  </defs>
  <rect x="1" y="1" width="638" height="338" rx="22" fill="#ffffff" fill-opacity="0.02" stroke="#94a3b8" stroke-opacity="0.25" />
  <path d="M100 250 L340 250 L430 170 L190 170 Z" fill="#8b5cf6" fill-opacity="0.10" stroke="#64748b" stroke-width="2" />
