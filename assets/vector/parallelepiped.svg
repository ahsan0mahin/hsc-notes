    <text x="84" y="270" data-bn="O" data-en="O">O</text>
    <text x="344" y="268" data-bn="A" data-en="A">A</text>
    <text x="184" y="162" data-bn="B" data-en="B">B</text>
    <text x="88" y="102" data-bn="C" data-en="C">C</text>
    <text x="224" y="268" fill="#c4b5fd" data-bn="A⃗" data-en="A⃗">A⃗</text>
