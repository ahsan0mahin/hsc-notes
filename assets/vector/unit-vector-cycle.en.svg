<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Noto Sans Bengali, system-ui, sans-serif">
  <defs><marker id="plus" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#22d3ee" /></marker><marker id="minus" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f59e0b" /></marker></defs>
  <rect x="1" y="1" width="638" height="298" rx="22" fill="#ffffff" fill-opacity="0.02" stroke="#94a3b8" stroke-opacity="0.25" />
  <line x1="320" y1="20" x2="320" y2="280" stroke="#94a3b8" stroke-opacity="0.22" />
  <g fill="#cbd5e1" font-size="13" font-weight="700"><text x="32" y="38">positive cycle (+)</text><text x="350" y="38">reverse cycle (−)</text></g>
  <g fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#plus)">
    <path d="M160 95 A75 75 0 0 1 245 170" /><path d="M245 170 A75 75 0 0 1 85 170" /><path d="M85 170 A75 75 0 0 1 160 95" />
  </g>
  <g fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#minus)">
    <path d="M480 95 A75 75 0 0 0 395 170" /><path d="M395 170 A75 75 0 0 0 555 170" /><path d="M555 170 A75 75 0 0 0 480 95" />
  </g>
  <g fill="#94a3b8" font-size="20" font-weight="800" text-anchor="middle">
    <text x="160" y="82">î</text><text x="258" y="190">ĵ</text><text x="65" y="190">k̂</text>
    <text x="480" y="82">î</text><text x="578" y="190">ĵ</text><text x="385" y="190">k̂</text>
    <text x="160" y="158" fill="#67e8f9" font-size="26">+</text><text x="480" y="158" fill="#fbbf24" font-size="26">−</text>
  </g>
  <g fill="#64748b" font-size="12"><text x="32" y="270">î × ĵ = k̂   ·   ĵ × k̂ = î   ·   k̂ × î = ĵ</text><text x="350" y="270">ĵ × î = −k̂   ·   k̂ × ĵ = −î   ·   î × k̂ = −ĵ</text></g>
</svg>
