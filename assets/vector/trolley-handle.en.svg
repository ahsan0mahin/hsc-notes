  <g fill="none" stroke="#f59e0b" stroke-width="2">
    <path d="M190 110 A48 48 0 0 0 226 96" /><path d="M560 92 A48 48 0 0 0 594 85" />
  </g>
  <g fill="#94a3b8" font-size="12" font-weight="700">
    <text x="248" y="70">F⃗</text>
    <text x="238" y="128" fill="#67e8f9">Fₓ = F cos θ₁</text>
    <text x="204" y="100" fill="#fbbf24">θ₁ large</text>
    <text x="588" y="68">F⃗</text>
    <text x="548" y="112" fill="#67e8f9">Fₓ = F cos θ₂</text>
    <text x="572" y="84" fill="#fbbf24">θ₂ small</text>
  </g>
  <g fill="#64748b" font-size="11.5">
    <text x="32" y="312">θ₁ &gt; θ₂, so cos θ₁ &lt; cos θ₂</text>
    <text x="350" y="312">longer handle gives larger Fₓ → easier pulling</text>
  </g>
