<!doctype html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" id="themeColorMeta" content="#080b12">
  <meta name="description" id="metaDescription" content="এইচএসসির পদার্থবিজ্ঞান, রসায়ন ও উচ্চতর গণিতের অধ্যায়ভিত্তিক দ্বিভাষিক নোট।">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HSC Notes — Bangla & English">
  <meta property="og:description" content="Chapter-wise HSC Physics, Chemistry and Higher Math notes with dark/light and BN/EN toggles.">
  <title>HSC Notes · বাংলা · English</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css">

  <script>
    try {
      var savedTheme = localStorage.getItem('hsc:theme');
      document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
      var savedLang = localStorage.getItem('hsc:lang');
      if (savedLang === 'bn' || savedLang === 'en') document.documentElement.lang = savedLang;
    } catch (error) {}
  </script>

  <script defer src="data/registry.js"></script>
  <script defer src="data/physics.js"></script>
  <script defer src="data/physics-vectors.js"></script>
  <script defer src="data/chemistry.js"></script>
  <script defer src="data/higher-math.js"></script>
  <script defer src="app.js"></script>
</head>
<body>

    <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2Z"/><path d="M8 3v18"/></symbol>

  <a class="skip-link" href="#main" data-action="skip-to-content" data-i18n="skipToContent">মূল কনটেন্টে যান</a>

  <header class="topbar">
    <div class="topbar-inner">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-controls="sidebar" aria-expanded="false" data-i18n-aria="openMenu">
        <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
      </button>

      <a class="brand" href="#/" aria-label="HSC Notes home">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-book"></use></svg></span>
        <span class="brand-copy">
          <strong>HSC Notes</strong>
          <small id="brandTagline" data-i18n="siteTagline">বাংলা · English নোট</small>
        </span>
      </a>

      <button class="search-trigger" id="searchTrigger" type="button" data-open-search aria-keyshortcuts="Control+K Meta+K" data-i18n-aria="searchAria">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <span class="search-label" data-i18n="searchPlaceholder">নোট খুঁজুন...</span>
        <kbd class="kbd" data-shortcut>⌘ K</kbd>
      </button>

      <div class="top-actions">
        <div class="lang-switch" role="group" data-i18n-aria="language" aria-label="Language">
          <button type="button" data-lang="bn" aria-pressed="true">বাং</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button class="icon-btn" id="themeBtn" type="button" data-i18n-aria="toggleTheme" aria-label="থিম বদলান">
          <svg class="icon" aria-hidden="true"><use href="#i-sun"></use></svg>
        </button>
        <a class="icon-btn github-btn" href="https://github.com/ahsan0mahin/hsc-notes" target="_blank" rel="noopener noreferrer" data-i18n-aria="githubRepo" aria-label="GitHub রিপো">
          <svg class="icon" aria-hidden="true"><use href="#i-github"></use></svg>
        </a>
      </div>
    </div>
    <div class="reading-progress" id="readingProgress" aria-hidden="true"></div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="side-top">
        <p class="side-title" data-i18n="browse">ব্রাউজ করুন</p>
        <button class="icon-btn side-close" id="sidebarClose" type="button" data-action="close-sidebar" data-i18n-aria="closeMenu" aria-label="মেনু বন্ধ করুন">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>
      <div class="side-scroll">
        <nav id="sidebarNav" aria-label="Subjects and chapters"></nav>
      </div>
      <div class="side-footer" id="sidebarFooter"></div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <button class="mobile-fab" id="mobileFab" type="button" data-open-search data-i18n-aria="searchAria" aria-label="নোট খুঁজুন">
    <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
  </button>

  <div class="search-modal" id="searchModal" hidden>
    <div class="search-backdrop" data-close-search></div>
    <section class="search-dialog" id="searchDialog" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
      <h2 class="sr-only" id="searchTitle" data-i18n="searchModalTitle">নোট খোঁজা</h2>
      <div class="search-input-row">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchHint" data-i18n-aria="searchAria" placeholder="টাইপ করুন: ভেক্টর, dot product...">
        <button class="esc-btn" type="button" data-close-search data-i18n="escLabel">Esc</button>
      </div>
      <div class="search-results" id="searchResults" aria-live="polite" data-i18n-aria="searchModalTitle"></div>
      <div class="search-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="navigate">ঘুরুন</span></span>
        <span><kbd>↵</kbd> <span data-i18n="select">খুলুন</span></span>
        <span><kbd>Esc</kbd> <span data-i18n="closeKey">বন্ধ</span></span>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">এই সাইটের মেনু, সার্চ ও ভাষা বদল চালাতে JavaScript প্রয়োজন।</div>
  </noscript>
</body>
</html>
